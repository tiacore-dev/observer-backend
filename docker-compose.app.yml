services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq-observer-${CONFIG_NAME}
    restart: always
    ports:
      - "${RABBIT_PORT}:5672"
      - "${RABBIT_UI_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: user
      RABBITMQ_DEFAULT_PASS: password
    healthcheck:
      # узел поднят и отвечает
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      observer_network:
        aliases:
          - rabbitmq-observer-${CONFIG_NAME}

  redis:
    image: redis:7-alpine
    container_name: redis-observer-${CONFIG_NAME}
    restart: always
    healthcheck:
      # вернет PONG если готов
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 5s
    networks:
      observer_network:
        aliases:
          - redis-observer-${CONFIG_NAME}

  web:
    image: ${DOCKERHUB_USERNAME}/observer-backend:${TAG}
    container_name: observer-${CONFIG_NAME}
    restart: always
    ports:
      - "${PORT}:8000"
    volumes:
      - ./logs:/app/logs
      - .env:/app/.env
    command: >
      gunicorn -c gunicorn.conf.py run:app
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Если у тебя есть эндпоинт /health — этот чек отработает из коробки.
    # Можно переопределить путь через переменную HEALTHCHECK_PATH=/live (например).
    environment:
      - HEALTHCHECK_PATH=/health
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "python -c \"import os,sys,urllib.request; url='http://127.0.0.1:8000'+os.getenv('HEALTHCHECK_PATH','/health'); ",
          "import urllib.error; ",
          "try:\n r=urllib.request.urlopen(url, timeout=2); sys.exit(0 if 200<=r.status<400 else 1)\n",
          "except Exception:\n sys.exit(1)\"",
        ]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    networks:
      - observer_network

  scheduler:
    image: ${DOCKERHUB_USERNAME}/observer-backend:${TAG}
    container_name: scheduler-${CONFIG_NAME}
    restart: always
    volumes:
      - ./logs:/app/logs
      - .env:/app/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      python schedule_run.py
    networks:
      - observer_network

networks:
  observer_network:
    external: true
